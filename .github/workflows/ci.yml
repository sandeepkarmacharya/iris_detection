name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Ruff
        uses: astral-sh/ruff-action@v3
        with:
          args: check .

      - name: Test with pytest
        run: |
          python -m pytest tests/ -v --tb=short

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Build Docker image
        run: |
          docker build -t iris-classifier:${{ github.sha }} .
          docker tag iris-classifier:${{ github.sha }} iris-classifier:latest

      - name: Test Docker image
        run: |
          docker run -d --name iris-test -p 8501:8501 iris-classifier:latest
          sleep 5
          curl -sf http://localhost:8501/_stcore/health | grep -q '^ok$' && echo "Health check passed"
          docker stop iris-test
          docker rm iris-test
